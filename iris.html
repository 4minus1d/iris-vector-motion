<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>it blinks back</title>
<style>
  :root { --ink:#fff; --line:#242424; --dim:#7d7d7d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #070707; color: var(--ink);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; letter-spacing: .04em;
  }
  canvas {
    display: block; height: min(80vh, 940px); width: auto; aspect-ratio: 9 / 16;
    background: #000; border: 1px solid var(--line);
  }
  .panel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(92vw, 520px); }
  button {
    font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); padding: 7px 13px; cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  button:hover:not(:disabled) { background: var(--ink); color: #000; border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: default; }
  input[type=range] { flex: 1 1 200px; accent-color: #fff; height: 2px; background: var(--line); cursor: pointer; }
  select {
    font: inherit; color: var(--ink); background: #0e0e0e;
    border: 1px solid var(--line); padding: 7px 8px; cursor: pointer;
  }
  .status { color: var(--dim); width: 100%; text-align: center; }
  .status.on { color: var(--ink); }
</style>
</head>
<body>

<canvas id="stage" width="1080" height="1920"></canvas>

<div class="panel">
  <button id="toggle">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
  <span id="clockLabel">0.0s</span>
  <select id="speed" title="Playback speed - also applies to the saved file">
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="0.75">0.75x</option>
    <option value="1" selected>1x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
    <option value="3">3x</option>
  </select>
  <button id="save">Save video</button>
  <span class="status" id="status"></span>
</div>

<script>
"use strict";

/* ==================================================================
   IT BLINKS BACK
   IRIS · no.1 · 1080x1920 · 15s · pure vector

   Caption:  you stopped. it noticed.
   Tags:     #motiondesign #creativecoding

   ---
   What it does, for whoever works on it next:

   An eye opens, and you fall through the pupil.

   Beyond it is a corridor of screens. Each one arrives out of the far
   dark as a circle - an eye - and becomes a screen as it reaches you.
   Every opening carries the frame's own shape, so for one instant the
   screen and the film you are watching are the same object, and going
   through it turns the world inside out. It gets faster.

   At the end of the tunnel there is always one more eye, and it never
   gets closer. Until you arrive, and it is a pupil, and two lids close
   around it, and it blinks, and you fall in again.

   We keep building brighter screens, and every one of them is shaped
   like the eye that made it.

   ---
   One geometry generator: every shape is an 8-segment cubic Bezier
   outline of 25 control points, so anything lerps into anything.
   Nothing is drawn that isn't a vector.
   ================================================================== */

const CONFIG = { W: 1080, H: 1920, fps: 60, expo: 10 };
const W = CONFIG.W, H = CONFIG.H;

/* ---------------- timeline (seconds) ---------------- */
const T = {
  blinkShut:  0.72,   // a blink: the sign of life
  blinkOpen:  0.92,
  dilate:     1.24,   // the pupil widens
  push:       1.90,   // the dive
  swap:       2.30,   // through the pupil, in darkness
  corridor:   2.55,   // the first screen
  accelEnd:   9.30,   // peak rate
  decelEnd:  10.65,
  arrive:     9.60,   // the corridor resolves into an eye
  arriveEnd: 12.00,
  end:       15.00
};
const DURATION = T.end;

/* ---------------- easing ----------------
   Used only where a thing genuinely snaps. The corridor runs on a
   velocity profile and the camera on a spline; neither eases.        */
const EXPO_NORM = 1 - Math.pow(2, -CONFIG.expo);
const EASE = {
  expo:   t => t <= 0 ? 0 : t >= 1 ? 1 : (1 - Math.pow(2, -CONFIG.expo * t)) / EXPO_NORM,
  glide:  t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 4),
  smooth: t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t)
};
// exact at the endpoints: a + (b-a)*1 is not reliably b in floating point,
// and a few ULPs of drift is enough to shift an antialiased edge.
const mix = (a, b, t) => t >= 1 ? b : t <= 0 ? a : a + (b - a) * t;
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
function seg(time, t0, t1) { return t1 <= t0 ? (time >= t1 ? 1 : 0) : clamp01((time - t0) / (t1 - t0)); }
function eseg(time, t0, t1, e) { return EASE[e || "expo"](seg(time, t0, t1)); }

/* ---------------- geometry ---------------- */
const KAPPA = 0.5522847498307936;

function outline(w, h, corners) {
  const a = w / 2, b = h / 2;
  const c = corners.map(r => [Math.min(r[0], a), Math.min(r[1], b)]);
  const TR = c[0], BR = c[1], BL = c[2], TL = c[3];
  const P = [];
  const push = (x, y) => P.push({ x: x, y: y });
  const edge = (x0, y0, x1, y1) => {           // straight run as a cubic
    push(x0 + (x1 - x0) / 3, y0 + (y1 - y0) / 3);
    push(x0 + (x1 - x0) * 2 / 3, y0 + (y1 - y0) * 2 / 3);
    push(x1, y1);
  };
  const k = r => KAPPA * r;

  push(-a + TL[0], -b);
  edge(-a + TL[0], -b, a - TR[0], -b);
  push(a - TR[0] + k(TR[0]), -b); push(a, -b + TR[1] - k(TR[1])); push(a, -b + TR[1]);
  edge(a, -b + TR[1], a, b - BR[1]);
  push(a, b - BR[1] + k(BR[1])); push(a - BR[0] + k(BR[0]), b); push(a - BR[0], b);
  edge(a - BR[0], b, -a + BL[0], b);
  push(-a + BL[0] - k(BL[0]), b); push(-a, b - BL[1] + k(BL[1])); push(-a, b - BL[1]);
  edge(-a, b - BL[1], -a, -b + TL[1]);
  push(-a, -b + TL[1] - k(TL[1])); push(-a + TL[0] - k(TL[0]), -b); push(-a + TL[0], -b);
  return P;
}

const disc  = d => outline(d, d, [[d/2,d/2],[d/2,d/2],[d/2,d/2],[d/2,d/2]]);
const rrect = (w, h, r) => outline(w, h, [[r,r],[r,r],[r,r],[r,r]]);
// wide arch on top, square below: the eyelids are this.
const dome  = (w, h, arch) => outline(w, h, [[w/2, arch], [0,0], [0,0], [w/2, arch]]);

const tp = (P, x, y) => P.map(p => ({ x: p.x + x, y: p.y + y }));
const sp = (P, sx, sy) => P.map(p => ({ x: p.x * sx, y: p.y * sy }));
function lerpP(A, B, t) {
  if (t >= 1) return B;
  if (t <= 0) return A;
  return A.map((p, i) => ({ x: p.x + (B[i].x - p.x) * t, y: p.y + (B[i].y - p.y) * t }));
}

/* ---------------- canvas ---------------- */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha: false });

function trace(P) {
  ctx.beginPath();
  ctx.moveTo(P[0].x, P[0].y);
  for (let i = 1; i < P.length; i += 3) ctx.bezierCurveTo(P[i].x, P[i].y, P[i+1].x, P[i+1].y, P[i+2].x, P[i+2].y);
  ctx.closePath();
}
function fillS(P, style) { trace(P); ctx.fillStyle = style; ctx.fill(); }
function strokeS(P, style, lw) { trace(P); ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.stroke(); }
function flood(style) { ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = style; ctx.fillRect(0,0,W,H); }

/* ---------------- camera ----------------
   One closed Hermite spline for the whole loop, tangents taken as finite
   differences in real time. Position and velocity are continuous across
   every key and across the seam, so the camera never eases into a stop -
   it is still travelling as it crosses frame zero.

   ZOOM is monotonic: the last three seconds and the first two are a
   single accelerating push, so you are always falling into the eye. It
   turns around exactly twice - at the apex, hidden inside the blackout,
   and at the wide point, buried in the lid sweep where the shapes are
   moving hardest.

   ROLL only ever sways a few degrees. A continuous barrel roll looked
   impressive on its own and was wrong: the screens have the frame's
   aspect ratio, and the whole point is that they line up with its edges
   as they swallow you. Spinning the camera means they never do.        */
const CAM = [
  { t:  0.00, x:   0, y:   0, z:  1.000, r:  0.000 },   // the frame you stop on
  { t:  0.85, x: -46, y: -24, z:  1.350, r:  0.045 },
  { t:  1.70, x: -78, y:  36, z:  2.600, r:  0.100 },
  { t:  2.05, x: -30, y:  18, z: 11.000, r:  0.060 },   // diving
  { t:  2.30, x:   0, y:   0, z: 46.000, r:  0.000 },   // apex, parked inside the black
  { t:  2.55, x:   0, y:   0, z:  4.000, r: -0.060 },   // still black
  { t:  2.90, x:  18, y: -14, z:  1.250, r: -0.110 },
  { t:  3.90, x: 118, y: -68, z:  1.200, r: -0.055 },
  { t:  5.00, x: -78, y: 104, z:  1.150, r:  0.070 },
  { t:  6.10, x: 132, y:  86, z:  1.100, r:  0.120 },
  { t:  7.20, x:-126, y: -76, z:  1.050, r:  0.040 },
  { t:  8.30, x:  92, y:-112, z:  1.000, r: -0.080 },
  { t:  9.40, x: -98, y:  62, z:  0.940, r: -0.125 },
  { t: 10.50, x:  26, y:  34, z:  0.860, r: -0.070 },
  { t: 11.40, x:  46, y: -18, z:  0.640, r:  0.030 },   // widest — inside the lid sweep
  { t: 12.60, x: -30, y:  26, z:  0.720, r:  0.090 },
  { t: 13.70, x:  38, y:  20, z:  0.850, r:  0.050 }
];
const ADV = [0, 0, 0, 0];   // every channel closes on itself over one loop

const CAM_K = CAM.map(k => ({ t: k.t, v: [k.x, k.y, Math.log(k.z), k.r] }));
const CAM_D = CAM_K.map((k, i) => {
  const d = CAM_K[(i + 1) % CAM_K.length].t - k.t;
  return d > 0 ? d : d + T.end;
});
const CAM_M = CAM_K.map((k, i) => {
  const n = CAM_K.length;
  const prev = CAM_K[(i - 1 + n) % n].v.map((v, c) => v - (i === 0 ? ADV[c] : 0));
  const next = CAM_K[(i + 1) % n].v.map((v, c) => v + (i === n - 1 ? ADV[c] : 0));
  const span = CAM_D[(i - 1 + n) % n] + CAM_D[i];
  return next.map((v, c) => (v - prev[c]) / span);
});

function sampleCam(time) {
  const n = CAM_K.length;
  const t = ((time % T.end) + T.end) % T.end;
  let i = n - 1;
  for (let k = 0; k < n; k++) { if (t >= CAM_K[k].t) i = k; else break; }
  const j = (i + 1) % n, d = CAM_D[i];
  const u = clamp01((t - CAM_K[i].t) / d);
  const u2 = u * u, u3 = u2 * u;
  const h00 = 2*u3 - 3*u2 + 1, h10 = u3 - 2*u2 + u, h01 = -2*u3 + 3*u2, h11 = u3 - u2;
  const o = [0, 0, 0, 0];
  for (let c = 0; c < 4; c++) {
    const vj = CAM_K[j].v[c] + (j === 0 ? ADV[c] : 0);
    o[c] = h00 * CAM_K[i].v[c] + h10 * d * CAM_M[i][c] + h01 * vj + h11 * d * CAM_M[j][c];
  }
  return { x: o[0], y: o[1], z: Math.exp(o[2]), r: o[3] };
}
function setCam(cam) {
  const z = cam.z;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2, H / 2);
  ctx.rotate(cam.r);
  ctx.scale(z, z);
  ctx.translate(-cam.x, -cam.y);
}
/* A screen's sideways displacement has to scale with how near it is, or every
   screen slides by the same amount and the tunnel reads as one flat thing
   inflating instead of rushing past. Placing screen n at this world position
   puts it at axis offset -cam * near, which is that parallax - and lands it
   at the world origin exactly when near reaches 1.                          */
const perspective = (cam, near) => [cam.x * (1 - near), cam.y * (1 - near)];

/* ---------------- the eye ---------------- */
const EYE = {
  half: 450,            // aperture half-width: the corners never move
  gap: 430,             // aperture height at centre
  lidW: 4000, lidH: 20000,
  pupilD: 290, ringD: 370, ringW: 13,
  catchD: 48, catchX: -95, catchY: -72
};
// Arc depth that puts both lid edges through the fixed corners. As the gap
// closes the arcs flatten, so a blink slides shut instead of shrinking.
const K_RY = 1 / (1 - Math.sqrt(1 - Math.pow(EYE.half / (EYE.lidW / 2), 2))) / 2;
const lidShape = gap => dome(EYE.lidW, EYE.lidH, K_RY * gap);
const lowerLid = gap => tp(lidShape(gap), 0, gap / 2 + EYE.lidH / 2);
const upperLid = gap => sp(lowerLid(gap), 1, -1);

/* ---------------- the corridor ----------------
   Screens sit at geometric depths, each one CORR.k times nearer than the
   one behind it. Travel is measured in screens passed, q, so the whole
   corridor is self-similar: advancing q by 1 scales the world by k and
   drops the nearest screen, and the pattern repeats exactly. That is what
   makes it endless without ever repeating a keyframe.

   The opening is 9:16 - the film's own aspect - so at the moment a screen
   swallows the camera, its edges and the frame's edges coincide.        */
const CORR = {
  k: 2.2,        // scale ratio between neighbouring screens
  base: 980,     // size of the nearest screen at q exactly integer
  shown: 7,      // screens drawn; beyond this they are sub-pixel
  morphIn: -3.4, // distance at which a far circle starts becoming a screen
  morphOut: -1.0
};

// Travel: accelerates from a measured drift to a frantic rate, then decays
// to rest as the corridor arrives. Velocity is continuous and never zero
// while anything is visible.
const Q = { v0: 0.75, v1: 4.20 };
const Q_U = T.accelEnd - T.corridor;
const Q_TAU = T.decelEnd - T.accelEnd;
const Q_A = Q.v0 * Q_U + (Q.v1 - Q.v0) * Q_U / 3;
const Q_END = Q_A + Q.v1 * Q_TAU * 0.5;

function qAt(time) {
  if (time <= T.corridor) return 0;
  if (time <= T.accelEnd) {
    const u = time - T.corridor;
    return Q.v0 * u + (Q.v1 - Q.v0) * u * u * u / (3 * Q_U * Q_U);
  }
  if (time >= T.decelEnd) return Q_END;
  const s = (time - T.accelEnd) / Q_TAU;
  return Q_A + Q.v1 * Q_TAU * (s / 2 + Math.sin(Math.PI * s) / (2 * Math.PI));
}

// far away it is a circle - an eye; near, a 9:16 screen
function portalShape(s, m) {
  if (m <= 0) return disc(s);
  const h = s * 1.14, w = h * 0.5625;
  return lerpP(disc(s), rrect(w, h, w * 0.14), m);
}

/* ---------------- render ---------------- */
function render(time) {
  const cam = sampleCam(time);
  if (time < T.swap) { flood("#fff"); drawEye(time, cam); }
  else drawCorridor(time, cam);
}

function drawEye(time, cam) {
  const shut = eseg(time, T.blinkShut - 0.22, T.blinkShut, "expo");
  const open = eseg(time, T.blinkShut, T.blinkOpen, "expo");
  const gap  = mix(mix(EYE.gap, 14, shut), EYE.gap, open);

  const dil = eseg(time, T.dilate, T.push, "expo");
  const pd  = mix(EYE.pupilD, EYE.pupilD * 1.20, dil);
  const rd  = mix(EYE.ringD, EYE.ringD * 1.10, dil);

  const out  = eseg(time, 0.30, 0.62, "expo");     // a glance away and back
  const back = eseg(time, 0.98, T.dilate, "expo");
  const px = mix(mix(0, -26, out), 0, back);

  setCam(cam);
  fillS(tp(disc(pd), px, 0), "#000");
  strokeS(tp(disc(rd), px, 0), "#000", EYE.ringW);
  fillS(tp(disc(EYE.catchD), px + EYE.catchX, EYE.catchY), "#fff");
  fillS(lowerLid(gap), "#000");
  fillS(upperLid(gap), "#000");
}

function drawCorridor(time, cam) {
  const q = qAt(time);
  const fl = Math.floor(q), f = q - fl;
  // Openings dilate out of the black we arrived in - the corridor opens like
  // an aperture - and close again as it resolves into the eye it was inside.
  const entry = eseg(time, T.swap, T.corridor + 0.30, "glide");
  // The nearest screen does not fade out. It stops being a screen: the tall
  // rounded rectangle morphs into the circle and stays as the pupil - the same
  // circle-to-rounded-rect morph the whole film is built from, run backwards.
  // starts only once the travel has stopped, so it is the last screen that
  // transforms rather than every screen shrinking on its way past
  const become = eseg(time, T.decelEnd - 0.20, T.arriveEnd - 0.30, "glide");
  const recede = eseg(time, T.decelEnd - 0.45, T.decelEnd + 0.35, "glide");   // the ones behind clear out first

  const col = n => ((fl + n) % 2 === 0) ? "#000" : "#fff";
  function screen(n) {
    const rel = f - n;
    let near = Math.pow(CORR.k, rel);       // 1 at the reference depth, larger when closer
    let s = CORR.base * near * entry;
    let m = clamp01((rel - CORR.morphIn) / (CORR.morphOut - CORR.morphIn));
    if (n === 0) { s = mix(s, EYE.pupilD, become); near = mix(near, 1, become); m = mix(m, 0, become); }
    else s = mix(s, 0, recede);
    return { s: s, near: near, m: m };
  }

  ctx.save();
  let n = 0;
  for (; n < CORR.shown; n++) {
    // Paint the wall. The live clip is the previous screen's opening, so
    // this lands as the band between that opening and this one.
    flood(col(n));

    const a = screen(n);
    if (a.s < 1) break;                     // no opening left: this colour fills the rest
    const off = perspective(cam, a.near);
    const shape = tp(portalShape(a.s, a.m), off[0], off[1]);
    setCam(cam);
    // The innermost opening is filled rather than clipped: a clip boundary is
    // hard-edged where a fill is antialiased, and the last one becomes the pupil.
    if (n === CORR.shown - 1 || screen(n + 1).s < 1) { fillS(shape, col(n + 1)); break; }
    trace(shape);
    ctx.clip();
  }
  ctx.restore();

  /* --- the eye closes around it ---
     Drawn as real filled paths in the same order as drawEye, not left as
     the clip edge: a clip boundary is hard-edged where a fill is
     antialiased, and the loop has to close on identical pixels.        */
  setCam(cam);
  const rd = EYE.ringD * eseg(time, T.decelEnd + 0.35, T.arriveEnd - 0.10, "glide");
  if (rd > 1) strokeS(disc(rd), "#000", EYE.ringW * (rd / EYE.ringD));

  const cl = EYE.catchD * eseg(time, T.arriveEnd - 0.9, T.arriveEnd + 0.6, "glide");
  if (cl > 0.5) fillS(tp(disc(cl), EYE.catchX, EYE.catchY), "#fff");

  const sweep = eseg(time, T.decelEnd + 0.25, T.arriveEnd + 0.2, "glide");
  if (sweep > 0) {
    fillS(tp(lowerLid(EYE.gap), 0, mix(2600, 0, sweep)), "#000");
    fillS(tp(upperLid(EYE.gap), 0, mix(-2600, 0, sweep)), "#000");
  }
}

/* ---------------- clock ---------------- */
let playing = true, clock = 0, last = performance.now(), recording = false;
/* Playback rate. Because render(t) is a pure function of continuous time, a
   slower speed does not repeat frames - it samples the animation at a finer
   step and computes genuinely new in-between frames. Real slow motion, not a
   post-process. Values are chosen so DURATION*fps/speed stays a whole number
   of frames, which is what keeps the exported loop seamless. */
let speed = 1;
const statusEl = document.getElementById("status");
const saveBtn  = document.getElementById("save");
const toggleBtn= document.getElementById("toggle");
const scrub    = document.getElementById("scrub");
const speedSel = document.getElementById("speed");
const clockLbl = document.getElementById("clockLabel");

function setStatus(text, on) { statusEl.textContent = text; statusEl.classList.toggle("on", !!on); }
function updateUI() {
  scrub.value = String(Math.round((clock / DURATION) * 1000));
  clockLbl.textContent = clock.toFixed(1) + "s";
}

// Playback only. While recording, the capture pump owns the clock and the
// canvas - see startRecording.
function tick(now) {
  requestAnimationFrame(tick);
  if (recording) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) clock = (clock + dt * speed) % DURATION;
  render(clock);
  updateUI();
}

/* ---------------- export ---------------- */
const MIMES = ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1.42E01E", "video/mp4",
               "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
function pickMime() {
  if (typeof MediaRecorder === "undefined") return null;
  for (const m of MIMES) if (MediaRecorder.isTypeSupported(m)) return m;
  return null;
}

const FRAME_MS = 1000 / CONFIG.fps;
const TOTAL_FRAMES = Math.round(DURATION * CONFIG.fps);

let recorder = null, chunks = [], wasPlaying = true, pumpId = 0;

/* Run the codec through a handful of throwaway frames and bin the result.
   Codec construction, GPU buffer allocation and the first keyframe are all
   expensive, and if that cost lands on the first frames of the real take it
   shows up as judder at the head of the file. Pay it here instead. */
function primeEncoder(stream, track, mime) {
  return new Promise(resolve => {
    let warm, done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    try { warm = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 }); }
    catch (err) { finish(); return; }
    warm.ondataavailable = () => {};
    warm.onstop = finish;
    warm.onerror = finish;
    setTimeout(finish, 1200);                       // never hang on a quirky implementation
    warm.start();
    let n = 0;
    const spin = () => {
      render(0);
      track.requestFrame();
      if (++n < 10) requestAnimationFrame(spin);
      else if (warm.state !== "inactive") warm.stop();
    };
    requestAnimationFrame(spin);
  });
}

async function startRecording() {
  const mime = pickMime();
  if (!mime) { setStatus("MediaRecorder unsupported in this browser", true); return; }
  // A hidden tab stops painting, requestAnimationFrame halts, and the capture
  // stream receives nothing - the recording would just sit at 0%. Say so.
  if (document.hidden) { setStatus("keep this tab visible to record", true); return; }

  /* frameRate 0 means nothing is captured until we ask. One requestFrame per
     rendered frame - no duplicates from a repaint, no drops from a missed one. */
  let stream = canvas.captureStream(0);
  let track = stream.getVideoTracks()[0];
  const manual = track && typeof track.requestFrame === "function";
  if (!manual) { stream = canvas.captureStream(CONFIG.fps); track = stream.getVideoTracks()[0]; }

  wasPlaying = playing;
  saveBtn.disabled = true;
  recording = true;
  setStatus("priming encoder...", true);
  if (manual) await primeEncoder(stream, track, mime);
  if (!recording) return;                           // cancelled while priming

  try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24000000 }); }
  catch (err) { setStatus("recorder failed: " + err.message, true); recording = false; saveBtn.disabled = false; return; }

  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const ext = mime.indexOf("video/mp4") === 0 ? "mp4" : "webm";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "iris-1080x1920." + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus("saved ." + ext + "  " + DURATION.toFixed(1) + "s  " + (blob.size / 1048576).toFixed(1) + " MB", true);
    saveBtn.disabled = false;
    last = performance.now();                       // don't hand playback a huge dt
    playing = wasPlaying;
    toggleBtn.textContent = playing ? "Pause" : "Play";
  };

  clock = 0;
  render(0);
  recorder.start();
  setStatus("recording... 0%", true);

  /* The capture pump.

     Animation time is a FIXED timestep - frame n is rendered at exactly
     n/fps, never at whatever the wall clock happened to read. Driving it from
     elapsed time was the real defect: when the encoder stalled, dt grew, and
     the animation leapt forward by however long the stall was. The judder was
     baked into the motion itself.

     Wall time only decides WHEN to emit, so playback speed stays correct on a
     60, 120 or 144Hz display. At most one frame per tick, so a late frame is
     never compensated by bunching two into the same instant. */
  const outFrames = Math.round(DURATION * CONFIG.fps / speed);
  let frame = 0, t0 = 0, lastStatus = 0;
  const pump = now => {
    if (!recording) return;
    pumpId = requestAnimationFrame(pump);
    if (!t0) t0 = now;
    if (Math.floor((now - t0) / FRAME_MS) < frame) return;

    clock = frame * speed / CONFIG.fps;
    render(clock);
    track.requestFrame();
    frame++;

    if (now - lastStatus > 200) {                   // DOM writes are not free: a
      lastStatus = now;                             // per-frame textContent write
      updateUI();                                   // competes with the encoder
      setStatus("recording... " + Math.round(frame / outFrames * 100) + "%", true);
    }
    if (frame >= outFrames) stopRecording();
  };
  pumpId = requestAnimationFrame(pump);
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  cancelAnimationFrame(pumpId);
  setStatus("encoding...", true);
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

/* ---------------- offline export ----------------
   The real fix for stutter: stop capturing and start rendering.

   canvas.captureStream + MediaRecorder is a REAL-TIME pipeline. At
   1080x1920x60 the encoder has to keep pace with the display, and when it
   cannot, frames are dropped or arrive late - and MediaRecorder timestamps by
   arrival, so that timing is baked into the file. No amount of clock
   discipline on our side fixes an encoder that is behind.

   Here every frame is rendered, handed to a VideoEncoder with an exact
   timestamp, and the encoded samples are muxed into an MP4 by hand. There is
   no deadline: the machine takes as long as it takes, and all 900 frames land
   on exact 1/60s boundaries. It also needs no requestAnimationFrame, so it
   works in a background tab.                                                */

const MP4 = {
  u8:  a => new Uint8Array(a),
  u16: n => new Uint8Array([n >> 8 & 255, n & 255]),
  u32: n => new Uint8Array([n >>> 24 & 255, n >>> 16 & 255, n >>> 8 & 255, n & 255]),
  str: s => { const o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; },
  cat: a => { let n = 0; for (const x of a) n += x.length; const o = new Uint8Array(n); let p = 0;
              for (const x of a) { o.set(x, p); p += x.length; } return o; }
};
const box  = (type, ...parts) => { const b = MP4.cat(parts);
  return MP4.cat([MP4.u32(b.length + 8), MP4.str(type), b]); };
const fbox = (type, ver, flags, ...parts) =>
  box(type, MP4.u8([ver, flags >> 16 & 255, flags >> 8 & 255, flags & 255]), ...parts);
const MATRIX = MP4.cat([0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000].map(MP4.u32));

// ISO base media, one H.264 track, all samples in a single chunk.
function muxMP4(samples, syncs, avcc, w, h, fps) {
  const { u8, u16, u32, str, cat } = MP4;
  const N = samples.length, TS = fps * 1000, DELTA = 1000, MTS = 1000;
  const movieDur = Math.round(N / fps * MTS), mediaDur = N * DELTA;

  const stsd = fbox("stsd", 0, 0, u32(1),
    box("avc1", u8(new Array(6).fill(0)), u16(1),
      u16(0), u16(0), u32(0), u32(0), u32(0),
      u16(w), u16(h), u32(0x00480000), u32(0x00480000), u32(0), u16(1),
      u8(new Array(32).fill(0)), u16(0x0018), u8([0xff, 0xff]),
      box("avcC", avcc)));
  const stts = fbox("stts", 0, 0, u32(1), u32(N), u32(DELTA));
  const stss = fbox("stss", 0, 0, u32(syncs.length), ...syncs.map(u32));
  const stsc = fbox("stsc", 0, 0, u32(1), u32(1), u32(N), u32(1));
  const stsz = fbox("stsz", 0, 0, u32(0), u32(N), ...samples.map(s => u32(s.length)));

  // stco holds an absolute file offset, which depends on moov's own size, so
  // build it once to measure and again with the real value. The length cannot
  // change: only the value inside a fixed-width u32 does.
  const build = dataStart => box("moov",
    fbox("mvhd", 0, 0, u32(0), u32(0), u32(MTS), u32(movieDur), u32(0x00010000),
         u16(0x0100), u8(new Array(10).fill(0)), MATRIX, u8(new Array(24).fill(0)), u32(2)),
    box("trak",
      fbox("tkhd", 0, 3, u32(0), u32(0), u32(1), u32(0), u32(movieDur),
           u8(new Array(8).fill(0)), u16(0), u16(0), u16(0), u16(0), MATRIX,
           u32(w * 65536), u32(h * 65536)),
      box("mdia",
        fbox("mdhd", 0, 0, u32(0), u32(0), u32(TS), u32(mediaDur), u16(0x55C4), u16(0)),
        fbox("hdlr", 0, 0, u32(0), str("vide"), u8(new Array(12).fill(0)), str("VideoHandler\0")),
        box("minf",
          fbox("vmhd", 0, 1, u16(0), u16(0), u16(0), u16(0)),
          box("dinf", fbox("dref", 0, 0, u32(1), fbox("url ", 0, 1))),
          box("stbl", stsd, stts, stss, stsc, stsz,
              fbox("stco", 0, 0, u32(1), u32(dataStart)))))));

  const ftyp = box("ftyp", str("isom"), u32(512), str("isom"), str("iso2"), str("avc1"), str("mp41"));
  const moov = build(ftyp.length + build(0).length + 8);
  let total = 0; for (const s of samples) total += s.length;
  return cat([ftyp, moov, cat([u32(total + 8), str("mdat"), ...samples])]);
}

const CODECS = ["avc1.640034", "avc1.640033", "avc1.64002a", "avc1.640028"];
// A MessageChannel turn is not throttled in a background tab; setTimeout is.
const yieldNow = () => new Promise(r => {
  const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0);
});

async function encoderConfig() {
  if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") return null;
  for (const codec of CODECS) {
    const cfg = { codec, width: W, height: H, bitrate: 20000000,
                  framerate: CONFIG.fps, avc: { format: "avc" } };
    try { const s = await VideoEncoder.isConfigSupported(cfg); if (s && s.supported) return cfg; }
    catch (err) { /* try the next one */ }
  }
  return null;
}

let exporting = false;

async function exportFilm() {
  if (exporting || recording) return;
  const cfg = await encoderConfig();
  if (!cfg) return startRecording();                  // no WebCodecs: real-time fallback

  exporting = true;
  saveBtn.disabled = true;
  speedSel.disabled = true;
  const wasPlaying2 = playing;
  playing = false;

  const samples = [], syncs = [];
  let avcc = null, failed = null, lastTs = -1, ordered = true;

  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description && !avcc)
        avcc = new Uint8Array(meta.decoderConfig.description);
      if (chunk.timestamp <= lastTs) ordered = false;  // B-frames would need ctts
      lastTs = chunk.timestamp;
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      if (chunk.type === "key") syncs.push(samples.length + 1);
      samples.push(d);
    },
    error: e => { failed = e.message; }
  });
  enc.configure(cfg);

  const outFrames = Math.round(DURATION * CONFIG.fps / speed);
  const us = 1e6 / CONFIG.fps;
  for (let n = 0; n < outFrames && !failed; n++) {
    clock = n * speed / CONFIG.fps;
    render(clock);
    const frame = new VideoFrame(canvas, {
      timestamp: Math.round(n * us), duration: Math.round(us)
    });
    enc.encode(frame, { keyFrame: n % CONFIG.fps === 0 });
    frame.close();
    while (enc.encodeQueueSize > 6 && !failed) await yieldNow();   // backpressure
    if (n % 15 === 0) {
      setStatus("rendering " + Math.round((n + 1) / outFrames * 100) + "%", true);
      await yieldNow();
    }
  }

  try { await enc.flush(); } catch (err) { failed = failed || err.message; }
  try { enc.close(); } catch (err) { /* already closed on error */ }

  const restore = () => { exporting = false; saveBtn.disabled = false; speedSel.disabled = false;
                          last = performance.now(); playing = wasPlaying2;
                          toggleBtn.textContent = playing ? "Pause" : "Play"; };

  // Refuse to write a file we cannot vouch for; fall back rather than ship a
  // subtly broken one.
  if (failed || !avcc || !ordered || samples.length !== outFrames) {
    setStatus(failed ? "encoder error: " + failed
              : !ordered ? "encoder reordered frames — using capture"
              : "encode incomplete — using capture", true);
    restore();
    return startRecording();
  }

  setStatus("writing mp4...", true);
  await yieldNow();
  const blob = new Blob([muxMP4(samples, syncs, avcc, W, H, CONFIG.fps)], { type: "video/mp4" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "iris-1080x1920" + (speed === 1 ? "" : "-" + speed + "x") + ".mp4";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  setStatus("saved .mp4  " + outFrames + " frames  " + (DURATION / speed).toFixed(1) + "s  "
            + (blob.size / 1048576).toFixed(1) + " MB", true);
  restore();
}

saveBtn.addEventListener("click", exportFilm);
// if the tab is hidden mid-take the stream starves, so abandon it honestly
document.addEventListener("visibilitychange", () => {
  if (document.hidden && recording) {
    recording = false;
    if (recorder && recorder.state !== "inactive") { recorder.onstop = null; recorder.stop(); }
    saveBtn.disabled = false;
    setStatus("recording cancelled — tab was hidden", true);
  }
});
toggleBtn.addEventListener("click", () => {
  if (recording) return;
  playing = !playing;
  toggleBtn.textContent = playing ? "Pause" : "Play";
});
speedSel.addEventListener("change", () => { speed = Number(speedSel.value) || 1; });

scrub.addEventListener("input", () => {
  if (recording) return;
  clock = (Number(scrub.value) / 1000) * DURATION;
  playing = false; toggleBtn.textContent = "Play";
  render(clock);
});
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggleBtn.click(); }
});

setStatus("IRIS  ·  1080 x 1920  ·  " + DURATION.toFixed(1) + "s loop  ·  " + CONFIG.fps + " fps");
requestAnimationFrame(tick);
</script>
</body>
</html>
